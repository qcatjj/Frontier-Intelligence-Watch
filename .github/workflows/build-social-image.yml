name: Build branded social preview
on:
  push:
    paths:
      - social-card.svg
      - .github/workflows/build-social-image.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install SVG renderer
        run: python3 -m pip install cairosvg==2.7.1
      - name: Render 1200 x 630 Open Graph preview
        run: |
          python3 - <<'PY'
          import cairosvg, struct
          cairosvg.svg2png(url='social-card.svg',write_to='og-image.png',output_width=1200,output_height=630)
          with open('og-image.png','rb') as f:
              header=f.read(24)
          assert header[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',header[16:24])==(1200,630)
          print('Branded Open Graph PNG generated successfully.')
          PY
      - name: Commit public preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.png
          if git diff --cached --quiet; then
            echo 'No image changes'
          else
            git commit -m "Build branded Facebook preview image"
            git push
          fi
