name: Weekly research candidate pack
on:
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find new primary-source candidates
        run: node scripts/weekly-candidates.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
