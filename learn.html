<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Weekly issues, plain-English guides, the archive, and a dictionary of frontier AI terms. Evidence, not hype.">
<title>Issues | Frontier Intelligence Watch</title>
<meta name="theme-color" content="#060916">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Frontier Intelligence Watch">
<meta property="og:title" content="Issues | Frontier Intelligence Watch">
<meta property="og:description" content="Plain-English issues and an AI dictionary. Evidence, not hype.">
<meta property="og:url" content="https://frontier-intelligence-watch.vercel.app/learn">
<meta property="og:image" content="https://frontier-intelligence-watch.vercel.app/api/og?v=f-brand-20261008">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Frontier Intelligence Watch">
<meta name="twitter:description" content="Plain-English issues and an AI dictionary. Evidence, not hype.">
<meta name="twitter:image" content="https://frontier-intelligence-watch.vercel.app/api/og?v=f-brand-20261008">
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="learn">
<a class="skip" href="#main">Skip to content</a>
<div class="topline" aria-hidden="true"></div>
<header class="site-header">
<div class="wrap bar">
<a class="brand" href="/"><img src="/brand-f.svg" alt="" width="44" height="46"><span class="brand-name">Frontier<br>Intelligence <em>Watch</em><small>Evidence, Not Hype</small></span></a>
<button class="menu" id="menu" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">☰</button>
<nav id="nav" class="nav" aria-label="Main">
<a data-latest-issue href="/issue/007">Latest issue</a>
<a href="/archive">Archive</a>
<a href="/tracker">AI race tracker</a>
<a href="/dictionary">Dictionary</a>
</nav>
</div>
</header>
<main id="main"><div class="wrap reader" id="root"><p class="fine">Loading the issue…</p></div></main>
<footer class="site-footer"><div class="wrap foot"><span>© 2026 Frontier Intelligence Watch · Evidence, not hype.</span><nav aria-label="Footer"><a href="/editorial-standards">Editorial standards</a><a href="/">Home</a></nav></div></footer>
<script>
(function(){
  const esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  const nav=document.getElementById('nav');
  const menu=document.getElementById('menu');
  function closeNav(){nav.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open menu');}
  menu.addEventListener('click',function(){const open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-label',open?'Close menu':'Open menu');});
  nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeNav);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeNav();});
  function norm(p){p=decodeURIComponent(p||'/');if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);return p;}
  function latestOf(issues){return issues.slice().sort(function(a,b){return (Number(b.number)||Number(b.id)||0)-(Number(a.number)||Number(a.id)||0);})[0];}
  function termLink(term){return '/dictionary#'+encodeURIComponent(String(term).toLowerCase().replace(/[^a-z0-9]+/g,'-'));}
  function hero(kicker,title,lead){return '<section class="page-hero"><div class="wrap"><p class="kicker">'+kicker+'</p><h1>'+title+'</h1>'+(lead?'<p class="lead">'+lead+'</p>':'')+'</div></section>';}
  function card(g){
    const flag=g.updateNote?' <span class="flag">Later update</span>':'';
    return '<article class="card"><p class="kicker">'+esc(g.category)+flag+'</p><h3><a href="/guide/'+encodeURIComponent(g.id)+'">'+esc(g.title)+'</a></h3><p>'+esc(g.lead)+'</p><p class="fine">'+esc(g.time)+' read · '+esc(g.date)+'</p></article>';
  }
  const path=norm(location.pathname);
  function mark(href){
    nav.querySelectorAll('a').forEach(function(a){a.removeAttribute('aria-current');});
    const el=nav.querySelector('a[href="'+href+'"]');
    if(el)el.setAttribute('aria-current','page');
  }
  if(path==='/archive')mark('/archive');
  else if(path==='/dictionary'||path.indexOf('/dictionary/')===0)mark('/dictionary');

  async function run(){
    const root=document.getElementById('root');
    let content;
    try{
      const r=await fetch('/data/content.json',{cache:'no-store'});
      if(!r.ok)throw new Error('missing');
      content=await r.json();
    }catch(e){
      root.innerHTML='<p class="fine">The issue archive could not be loaded. Refresh the page in a moment.</p>';
      return;
    }
    const guides=content.guides||[], issues=content.issues||[], glossary=content.glossary||[];
    const latest=latestOf(issues);
    if(latest){
      const href='/issue/'+encodeURIComponent(latest.id);
      document.querySelectorAll('[data-latest-issue]').forEach(function(a){a.href=href;});
    }
    if(path==='/dictionary'||path.indexOf('/dictionary/')===0){
      document.title='AI dictionary | Frontier Intelligence Watch';
      const cats=['All'].concat(Array.from(new Set(glossary.map(function(x){return x.category;}))));
      root.innerHTML=hero('Dictionary','Plain words for frontier AI.','Short definitions used in the issues. This is a reading aid, not a technical standard.')
        +'<section class="reader"><div class="wrap"><label class="kicker" for="termsearch">Search</label><input class="search" id="termsearch" type="search" placeholder="Try AGI, sandbox, agent" aria-label="Search dictionary"><div class="filters" id="filters">'+cats.map(function(c,i){return '<button type="button" aria-pressed="'+(i?'false':'true')+'" data-category="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div><div class="dict-grid" id="entries"></div><p id="none" class="fine" hidden>No matching terms.</p></div></section>';
      let cat='All';
      function render(){
        const q=document.getElementById('termsearch').value.toLowerCase();
        const rows=glossary.filter(function(g){return (cat==='All'||g.category===cat)&&(g.term+' '+g.full+' '+g.meaning).toLowerCase().indexOf(q)!==-1;});
        document.getElementById('entries').innerHTML=rows.map(function(g){
          const id=String(g.term).toLowerCase().replace(/[^a-z0-9]+/g,'-');
          return '<article class="entry" id="'+esc(id)+'"><p class="kicker">'+esc(g.category)+'</p><h3>'+esc(g.term)+'</h3><p class="fine">'+esc(g.full)+'</p><p>'+esc(g.meaning)+'</p><p class="example">Example: '+esc(g.example)+'</p></article>';
        }).join('');
        document.getElementById('none').hidden=rows.length>0;
      }
      document.getElementById('termsearch').addEventListener('input',render);
      document.querySelectorAll('[data-category]').forEach(function(b){
        b.addEventListener('click',function(){
          cat=b.dataset.category;
          document.querySelectorAll('[data-category]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
          render();
        });
      });
      render();
      if(location.hash){
        const target=location.hash.slice(1);
        requestAnimationFrame(function(){const el=document.getElementById(target);if(el)el.scrollIntoView();});
      }
      return;
    }
    if(path==='/archive'||path==='/issues'){
      document.title='Archive | Frontier Intelligence Watch';
      const ordered=issues.slice().sort(function(a,b){return (Number(b.number)||0)-(Number(a.number)||0);});
      root.innerHTML=hero('Archive','Every published issue.',esc(ordered.length+' published editions, newest first. Each one stays available. A missing date has not been published.'))
        +'<section class="reader"><div class="wrap"><div class="story-grid">'+ordered.map(function(i){
          return '<article class="card"><p class="kicker">Issue '+esc(i.id)+' · '+esc(i.date)+'</p><h3><a href="/issue/'+esc(i.id)+'">'+esc(i.title)+'</a></h3><p>'+esc(i.intro)+'</p><p class="fine">'+esc(i.period)+' · '+esc((i.guideIds||[]).length)+' guides</p></article>';
        }).join('')+'</div><div class="notice"><p>Issues are added after editorial review. Automated publishing is not connected, so this list is the whole public record.</p></div></div></section>';
      return;
    }
    if(path.indexOf('/guide/')===0){
      const id=path.split('/')[2];
      const g=guides.find(function(item){return item.id===id;});
      if(!g){
        document.title='Guide not found | Frontier Intelligence Watch';
        root.innerHTML=hero('Not found','This guide is not in the archive.','')+'<section class="reader"><div class="wrap"><p><a href="/archive">Browse published issues</a></p></div></section>';
        return;
      }
      document.title=g.title+' | Frontier Intelligence Watch';
      const homes=issues.filter(function(i){return (i.guideIds||[]).indexOf(g.id)!==-1;}).sort(function(a,b){return (Number(b.number)||0)-(Number(a.number)||0);});
      const home=homes[0];
      const back=home?'<a class="back" href="/issue/'+esc(home.id)+'">← Issue '+esc(home.id)+'</a>':'<a class="back" href="/archive">← Archive</a>';
      const siblings=home?(home.guideIds||[]).map(function(gid){return guides.find(function(item){return item.id===gid;});}).filter(function(item){return item&&item.id!==g.id;}):[];
      const update=g.updateNote?'<div class="update"><p class="kicker">Later update</p><p>'+esc(g.updateNote)+'</p>'+(g.updateLink?'<p><a href="'+esc(g.updateLink)+'">Read the later guide</a></p>':'')+'</div>':'';
      root.innerHTML=hero(esc(g.category)+' · '+esc(g.date),esc(g.title),esc(g.lead))
        +'<section class="reader"><div class="wrap">'+back+update
        +'<div class="prose-wrap"><article class="prose"><p class="fine">'+esc(g.time)+' read · '+esc(g.status)+'</p><h2>What happened?</h2><p>'+esc(g.happened)+'</p><h2>Why it matters</h2><p>'+esc(g.matters)+'</p><div class="analogy"><p class="kicker">In other words</p><p>'+esc(g.analogy)+'</p></div><h2>What this does not prove</h2><p>'+esc(g.limits)+'</p><h2>Words used here</h2><div class="terms">'+ (g.terms||[]).map(function(t){return '<a class="term" href="'+termLink(t)+'">'+esc(t)+'</a>';}).join('')+'</div><h2>Original sources</h2>'+(g.sources||[]).map(function(s){return '<a class="source" href="'+esc(s[1])+'" target="_blank" rel="noopener noreferrer">'+esc(s[0])+'</a>';}).join('')+'</article><aside class="side"><h2>'+(home?'In issue '+esc(home.id):'More guides')+'</h2>'+siblings.map(function(item){return '<a href="/guide/'+esc(item.id)+'">'+esc(item.title)+'</a>';}).join('')+'<a href="/dictionary">AI dictionary</a></aside></div></div></section>';
      return;
    }
    const issueId=path.indexOf('/issue/')===0?path.split('/')[2]:(latest?latest.id:'');
    const issue=issues.find(function(item){return item.id===issueId;});
    if(!issue){
      document.title='Issue not found | Frontier Intelligence Watch';
      root.innerHTML=hero('Not found','This edition is not in the archive.','')+'<section class="reader"><div class="wrap"><p><a href="/archive">Browse published issues</a></p></div></section>';
      return;
    }
    if(latest&&issue.id===latest.id){
      const link=nav.querySelector('[data-latest-issue]');
      if(link)link.setAttribute('aria-current','page');
    }
    document.title='Issue '+issue.id+' | Frontier Intelligence Watch';
    const selected=(issue.guideIds||[]).map(function(gid){return guides.find(function(g){return g.id===gid;});}).filter(Boolean);
    const hasUpdate=selected.some(function(g){return g.updateNote;});
    const label=(latest&&issue.id===latest.id?'Latest · ':'')+'Issue '+esc(issue.id);
    root.innerHTML=hero(label+' · '+esc(issue.date),esc(issue.title),esc(issue.intro))
      +'<section class="reader"><div class="wrap"><p class="fine">'+esc(issue.period)+' · Editorially prepared</p>'
      +'<div class="notice"><p class="kicker">The big picture</p><ul>'+(issue.takeaways||[]).map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>'
      +(hasUpdate?'<div class="update"><p>One or more guides in this edition have a later update. Open the guide to read what a newer issue reported. The original wording is unchanged.</p></div>':'')
      +'<div class="actions"><a class="btn btn-ghost" href="/archive">All issues</a><a class="btn btn-ghost" href="/dictionary">Dictionary</a></div>'
      +'<div class="story-grid">'+selected.map(card).join('')+'</div>'
      +'<div class="analogy"><p class="kicker">A question to sit with</p><p>'+esc(issue.question)+'</p></div>'
      +'<p class="fine">This is a dated edition. Later evidence is added as an update note, not by rewriting this week.</p></div></section>';
  }
  run();
})();
</script>
</body>
</html>
